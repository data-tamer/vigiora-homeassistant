[project]
name = "vigiora-homeassistant"
version = "0.2.0"
description = "Vigiora integration for Home Assistant"
requires-python = ">=3.13"
license = "Apache-2.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PIE", "PL", "LOG", "G", "S", "D"]
ignore = [
  "D203", "D213", "D105", "D107",
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",
  "RUF012", "D401", "ASYNC109",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["D103", "T201"]
"tests/*" = ["S101", "D", "PLC0415", "S105", "S106", "E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "homeassistant"]
combine-as-imports = true
