speak:
  fields:
    text:
      required: true
      example: "Your parcel has arrived"
      selector:
        text:
          multiline: true
    camera:
      selector:
        entity:
          integration: vigiora
          domain: camera
    output_id:
      selector:
        number:
          min: 1
          max: 1000000
          mode: box
    room_id:
      selector:
        number:
          min: 1
          max: 1000000
          mode: box
    volume:
      selector:
        number:
          min: 0
          max: 2
          step: 0.1
    config_entry_id:
      selector:
        config_entry:
          integration: vigiora

ptz_goto_preset:
  fields:
    camera:
      required: true
      selector:
        entity:
          integration: vigiora
          domain: camera
    preset:
      required: true
      example: "Gate"
      selector:
        text:

ptz_move:
  fields:
    camera:
      required: true
      selector:
        entity:
          integration: vigiora
          domain: camera
    pan:
      default: 0
      selector:
        number:
          min: -1
          max: 1
          step: 0.1
    tilt:
      default: 0
      selector:
        number:
          min: -1
          max: 1
          step: 0.1
    zoom:
      default: 0
      selector:
        number:
          min: -1
          max: 1
          step: 0.1
    duration_ms:
      default: 400
      selector:
        number:
          min: 1
          max: 5000
          unit_of_measurement: ms

describe_camera:
  fields:
    camera:
      required: true
      selector:
        entity:
          integration: vigiora
          domain: camera
    include_objects:
      default: false
      selector:
        boolean:
    prompts:
      example: '["person", "parcel"]'
      selector:
        text:
          multiple: true

detect_objects:
  fields:
    camera:
      required: true
      selector:
        entity:
          integration: vigiora
          domain: camera
    prompts:
      example: '["person", "red t-shirt", "parcel"]'
      selector:
        text:
          multiple: true
    min_confidence:
      selector:
        number:
          min: 0.01
          max: 0.99
          step: 0.01

acknowledge_alert:
  fields:
    alert_id:
      required: true
      selector:
        number:
          min: 1
          max: 1000000000
          mode: box
    config_entry_id:
      selector:
        config_entry:
          integration: vigiora
